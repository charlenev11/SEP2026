<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="dreams&co2.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
*{box-sizing:border-box;}
body{
margin:0;
min-height:100vh;
min-height:100dvh;
display:grid;
place-items:center;
background-image:url("blurred_image_bg.png");
background-position:center;
background-size:cover;
font-family:Segoe UI;
color:#1F2D3A;
background-repeat:no-repeat;
}

.login-box{
width:min(340px,calc(100% - 32px));
background:white;
padding:32px 28px;
border-radius:25px;
}

.logo{
width:180px;
max-width:100%;
display:block;
margin:0 auto 10px;
}

input[type="text"],
input[type="password"]{
width:100%;
background:#F5F8FA;
padding:7px;
font:inherit;
color:inherit;
border-radius:14px;
border-style:solid;
}

input[type="submit"]{
background-color:#FFA26B;
border:none;
padding:13px;
width:50%;
border-radius:14px;
font:inherit;
cursor:pointer;
font-weight:bold;
}

@media(max-width:600px){
body{
background-position:50% center;
}
}
</style>
<script>
function validateForm(){
let username=document.loginPage.username.value;
let password=document.loginPage.password.value;

if(username==""){
alert("Please fill in username!");
return false;
}

if(!/^[A-Za-z]+$/.test(username)){
alert("Username can only contain letters.");
return false;
}

if(password==""){
alert("You didn't type in your password.");
return false;
}

if(password.length<8){
alert("Password must be at least 8 characters long.");
return false;
}
alert("You have successfully logged in!")
return true;
}

</script>
</head>
<body>

<div class="login-box">
<img src="Dreams&Co.png" class="logo">
<h2 style="font-size:25px;">Login to continue!</h2>

<form name=loginPage onsubmit="return validateForm()">

<label for="username">Username:</label><br>
<input type="text" id="username" name=username><br><br>


<label for="password">Password:</label><br>
<input type="password" id="password" name="password"><br><br>

<center><input type="submit" value="Login"></center>
</form>
</div>
</body>
</html>
