<!DOCTYPE html>
<html><head>
<title>Table</title>
<link rel="icon" href="hirono.jpg" type="image/jpg">
<meta name=viewport content=width=device-width, initial-scale=1.0>

<script>

function showmessage(x){
alert("This is data row-1 col-1")
}

function dataRow1Col2(x){
alert("This is data row-1 col-2")
}

function dataRow1Col3(x){
alert("This is data row-1 col-3")
}

</script>
</head>
<body topmargin=20 leftmargin=50>

<table border=3 width=500 height=500 align=center>
<caption>My First Web Table<br><br></caption>
<tr>
<th>header one</th>
<th>header two</th>
<th>header three</th>
<th>header four</th>
</tr>

<tr>
<td onclick="showmessage(this)">data row1-col1</td>
<td onmouseover="dataRow1Col2(this)">data row1-col2</td>
<td ondblclick="dataRow1Col3(this)">data row1-col3</td>
<td id = "col4">data row1-col4</td>
</tr>

<tr>
<td>data row2-col1</td>
<td>data row2-col2</td>
<td>data row2-col3</td>
<td>data row2-col4</td>
</tr>

<tr>
<td>data row3-col1</td>
<td>data row3-col2</td>
<td>data row3-col3</td>
<td>data row3-col4</td
</tr>

</table>


<script>
  document.getElementById("col4").onclick = function() {
  changeEffect()    
  };
  function changeEffect()    {
    document.getElementById("col4").style.color = "#C71585";
    document.getElementById("col4").style.backgroundColor = "#B0E0E6";
  };
</script>


</body>
</html>
