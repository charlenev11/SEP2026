alert("Please provide your First Name!");

}

//to validate text - only allow alphabet characters
let y=document.MyFirstForm.lname.value;

if(!y.match(letters))
{

</head>
<body topmargin=50>

<script>
function changeCourse(){
var course=document.getElementById("Course").value;
var subject=document.getElementById("Subject");

if(course=="DCS"){
subject.innerHTML=
'<option value="0">-List of subjects-</option>'+
'<option value="DCS3003">DCS3003</option>'+
'<option value="DCS1003">DCS1003</option>'+
'<option value="DCS1203">DCS1203</option>';
} else if(course=="DIB"){
subject.innerHTML=
'<option value="0">-List of subjects-</option>'+
'<option value="DIB1234">DIB1234</option>'+
'<option value="DIB1235">DIB1235</option>'+
'<option value="DIB1236">DIB1236</option>';
} else if(course=="DAS"){
subject.innerHTML=
'<option value="0">-List of subjects-</option>'+
'<option value="DAS4564">DAS4564</option>'+
'<option value="DAS8523">DAS8523</option>'+
'<option value="DAS3333">DAS3333</option>';
} else {
subject.innerHTML='<option value="0">-List of subjects-</option>';
}
}


</script>

<center>
<form>  
<table>
<caption>Personal details:</caption>
<tr>
<td width='40%' class='title'>First Name: 
</td>
<td><input type=text name=fname></td>
</tr>
<tr>
<td class='title'>Last Name: </td>
<td><input type=text name=lname></td>
</tr>
<tr>
<td class='title'>Gender: </td>
<td>
<input type = radio name = gender value = Male> Male
<input type = radio name = gender value = Female> Female
</td>
</tr>
<tr>
<td class='title'>
Choose your favorite subjects:</td>
<td>
<input type=checkbox name=fav_sub value=DCS4103>DCS4103
<input type=checkbox name=fav_sub value=DCS3003>DCS3003
<input type=checkbox name=fav_sub value=MST1003>MST1003
<input type=checkbox name=fav_sub value=MST2003>MST2003
</td>
</tr>
<tr><td class='title'>Address:</td>
<td><textarea rows=4 cols=30 name=address></textarea></td>
</tr>
<tr><td class='title'>Date of birth:</td>
<td><input type=date name=dob></td>
</tr>
<tr>
<td class='title'>Login password:</td>
<td><input type=password name=loginpass>
</td>
</tr>

<tr>
<td class='title'>Course:</td>
<td>
<select id="Course" onchange="changeCourse()">
<option value="0">-List of courses-</option>
<option value="DCS">DCS</option>
<option value="DIB">DIB</option>
<option value="DAS">DAS</option>
</select>

<select id="Subject">
<option value="0">-List of subjects-</option>

</select>
</td>
</tr>

</table>
<br><br>
<input type=submit value=Submit>
<input type=reset value=Reset>
</td></tr><br><br>
</form></center>
