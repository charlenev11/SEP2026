<!DOCTYPE html>
<html>
<head>
<title>Form - Text Input</title>
<link rel="icon" href="hirono.jpg" type="image/jpg">
<meta name=viewport content=width=device-width, initial-scale=1.0>
</head>
<body topmargin=50>
<center>
<form>
<br>
<table cellspacing=13px align=center
style="background-color:powderblue;
color:#696969;font-family:Nunito,Segoe UI;
font-size:140%;
text-align:left;
width:60%;height:40%;
border-radius:9px;">
<caption style="background-color:powderblue;border-radius:7px;outline-style:dotted">Personal details:</caption>
<br><br>
<td style="background-color:grey;color:white;border-radius:7px;">First Name:</td>
<td><input type=text name=fname size=40 style="border-radius:7px;"></td>
</tr>
<tr>
<td style="background-color:grey;color:white;border-radius:7px;">Last Name:</td>
<td><input type=text name=lname size=40 style="border-radius:7px;"></td>
</tr>
<tr>
<td style="background-color:grey;color:white;border-radius:7px;">Gender:</td>
<td><input type=radio name=gender value=Male>Male
<input type=radio name=gender value=Female>Female</td>
</tr>
<tr>
<td style="background-color:grey;color:white;border-radius:7px;">Choose your favourite subjects:<br></td>
<td><input type=checkbox name=fav_sub value=DCS4103>DCS4103
<input type=checkbox name=fav_sub value=DCS3003>DCS3003
<input type=checkbox name=fav_sub value=MST1003>MST1003
<input type=checkbox name=fav_sub value=MST2003>MST2003</td>
</tr>
<tr>
<td style="background-color:grey;color:white;border-radius:7px;">Address:</td>
<td><textarea rows=4 cols=30 name=address style="border-radius:7px;"></textarea></td>
</tr>
<tr>
<td style="background-color:grey;color:white;border-radius:7px;">Date of birth:</td>
<td><input type=date name=dob></td>
</tr>
<tr>
<td style="background-color:grey;color:white;border-radius:7px;">Login password:</td>
<td><input type=password name=loginpass style="border-radius:7px;"></td>
</tr>
<tr>
<td style="background-color:grey;color:white;border-radius:7px;">Course:</td>
<td><select>
<option value="0">-List of Courses-</option>
<option value="DCS" selected>Diploma in Computer Science</option>

<optgroup label="Diploma in Computer Science">
<option value="DCS_S1">Semester 1</option>
<option value="DCS_S2">Semester 2</option>
<option value="DCS_S3">Semester 3</option>
<option value="DCS_S4">Semester 4</option>
<option value="DCS_S5">Semester 5</option>
<option value="DCS_S6">Semester 6</option>
</optgroup>

<option value="DIB">Diploma in Business</option>
<option value="DAS">Diploma in Airline Services</option>
</select></td>
</tr>
<tr>
<td></td>
<td></td>
</tr>
<tr>
<td></td>
<td></td>
</tr>
<tr>
<td></td>
<td><input type=submit value=Submit>
<input type=reset value=Reset></td>
</tr>
<br>
</table>
</form>
</center>
</body>
</html>
