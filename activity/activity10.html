<!DOCTYPE html>
<html>
<head>
<title>Form - Text Input</title>
<link rel="icon" href="hirono.jpg" type="image/jpg">
<meta name=viewport content=width=device-width, initial-scale=1.0>
<script>
function validateForm(){
//to validate text - do not allow empty 
let x = document.MyFirstForm.fname.value;
if(x==""){
alert("Please provide your First Name!");
return false;
}

//to validate text - only allow alphabet characters
let y=document.MyFirstForm.lname.value;
var letters=/^[A-Za-z]/;
if(!y.match(letters))
{
alert("Please input alphabet characters for Last Name.");
return false;
}

if((document.MyFirstForm.gender[0].checked==false) && (document.MyFirstForm.gender[1].checked==false))
{
alert("Please choose Gender: Male or Female");
return false;
}
let subjects=document.MyFirstForm.fav_sub;
let checked=false;
for(let i=0; i<subjects.length; i++){
if(subjects[i].checked){
checked=true;
break;
}
}
if(!checked){
alert("No Checkbox is checked");
return False;
}
return true;
}
</script>
</head>
<body topmargin=50>
<center>
<form name=MyFirstForm onsubmit="return validateForm()">
<p style="background-color:powderblue;
color:#696969;font-family:Nunito;
font-size:160%;
text-align:center;
width:60%;height:40%;">
<br>
Personal details:
<br><br>
First Name: <input type=text name=fname size=50 maxlength=10>
<br>
Last Name: <input type=text name=lname placeholder='Last Name' autofocus>
<br>
Gender:
<input type=radio name=gender value=Male>Male
<input type=radio name=gender value=Female>Female
<br>
Choose your favourite subjects:<br>
<input type=checkbox name=fav_sub value=DCS4103>DCS4103<br>
<input type=checkbox name=fav_sub value=DCS3003>DCS3003<br>
<input type=checkbox name=fav_sub value=MST1003>MST1003<br>
<input type=checkbox name=fav_sub value=MST2003>MST2003<br>
<br>
Address:
<textarea rows=4 cols=30 name=address></textarea>
<br>
Date of birth:
<input type=date name=dob min=2000-01-01 max=2005-12-31>
<br>
Login password:
<input type=password name=loginpass readonly>
<br>
Course:
<select>
<option value="0">-List of Courses-</option>
<option value="DCS" selected>Diploma in Computer Science</option>

<optgroup label="Diploma in Computer Science">
<option value="DCS_S1">Semester 1</option>
<option value="DCS_S2">Semester 2</option>
<option value="DCS_S3">Semester 3</option>
<option value="DCS_S4">Semester 4</option>
<option value="DCS_S5">Semester 5</option>
<option value="DCS_S6">Semester 6</option>
</optgroup>

<option value="DIB">Diploma in Business</option>
<option value="DAS">Diploma in Airline Services</option>
</select>
<br>
<input type=submit value=Submit>
<input type=reset value=Reset>
<br>

</form>
</center>
</body>
</html>
